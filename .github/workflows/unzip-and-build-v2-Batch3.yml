name: Build AzadNet Final

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "Using preinstalled Android SDK on runner"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "Android SDK ready"

      - name: Fix Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=10000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Android-v1.0.0
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Source ZIP
        if: always()
        run: |
          zip -r AzadNet-Source-v1.0.0.zip . -x "*.git*" -x "*build*" -x "*local.properties*" -x "*.apk" -x "*artifacts*" -x "*.idea*" -x "*gradle/caches*" -x "*gradle/wrapper/dists*"

      - name: Upload Source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Source-v1.0.0
          path: AzadNet-Source-v1.0.0.zip
          retention-days: 30
