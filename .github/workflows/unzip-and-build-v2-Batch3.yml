name: Build AzadNet Final

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Extract and prepare source
        run: |
          set -e
          echo "=== Before ==="
          ls -la

          if [ -f AzadNet-Source-v1.0.0.zip ]; then
            unzip -o AzadNet-Source-v1.0.0.zip
          fi
          if [ -f AzadNet_Source.zip ]; then
            unzip -o AzadNet_Source.zip
          fi

          if [ -d AzadNet ]; then
            echo "Flattening AzadNet/ into repo root..."
            cp -a AzadNet/. .
            rm -rf AzadNet
          fi

          echo "=== After flatten ==="
          ls -la
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Source is ready at repository root."

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # پیدا کردن sdkmanager
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            $(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1)
          do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading commandlinetools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "SDK ready"

      - name: Install Gradle 8.7
        run: |
          set -e
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          /opt/gradle-8.7/bin/gradle --version

      - name: Build Debug APK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          # حذف gradlew خراب تا از gradle واقعی استفاده شود
          rm -f ./gradlew ./gradlew.bat

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          gradle assembleDebug --stacktrace --no-daemon

          echo "=== APK outputs ==="
          find app/build/outputs -name "*.apk" -ls

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Android-v1.0.0
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Source ZIP
        if: always()
        run: |
          zip -r AzadNet-Source-v1.0.0.zip . \
            -x "*.git*" -x "*build*" -x "*local.properties*" \
            -x "*.apk" -x "*artifacts*" -x "*.idea*" \
            -x "*gradle/caches*" -x "*gradle/wrapper/dists*" \
            -x "AzadNet-Source-v1.0.0.zip" -x "AzadNet_Source.zip"

      - name: Upload Source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Source-v1.0.0
          path: AzadNet-Source-v1.0.0.zip
          retention-days: 30
