name: Build AzadNet Final

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Extract source if nested in ZIP
        run: |
          set -e
          echo "=== Repository contents ==="
          ls -la

          # اگر سورس داخل یک ZIP باشد، آن را باز کن
          if [ -f AzadNet_Source.zip ]; then
            echo "Found AzadNet_Source.zip – extracting..."
            unzip -o AzadNet_Source.zip
          fi
          if [ -f AzadNet-Source-v1.0.0.zip ]; then
            echo "Found AzadNet-Source-v1.0.0.zip – extracting..."
            unzip -o AzadNet-Source-v1.0.0.zip
          fi

          # اگر پوشه AzadNet وجود دارد، محتوایش را به ریشه بیاور
          if [ -d AzadNet ] && [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "Moving AzadNet/* to repository root..."
            shopt -s dotglob
            mv AzadNet/* .
            rmdir AzadNet 2>/dev/null || true
          fi

          echo "=== After extract ==="
          ls -la
          echo "Looking for Gradle files:"
          find . -name "build.gradle*" -o -name "settings.gradle*" -o -name "gradlew" | head -20

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              > gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          set -e
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: No Android project found at repository root."
            echo "Please extract the source ZIP into the repo root (app/, build.gradle.kts, ...)."
            ls -la
            exit 1
          fi

          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace --no-daemon
          fi

          echo "=== APK outputs ==="
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found yet"

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Android-v1.0.0
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Source ZIP
        if: always()
        run: |
          zip -r AzadNet-Source-v1.0.0.zip . \
            -x "*.git*" -x "*build*" -x "*local.properties*" \
            -x "*.apk" -x "*artifacts*" -x "*.idea*" \
            -x "*gradle/caches*" -x "*gradle/wrapper/dists*" \
            -x "AzadNet_Source.zip" -x "AzadNet-Source-v1.0.0.zip"

      - name: Upload Source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Source-v1.0.0
          path: AzadNet-Source-v1.0.0.zip
          retention-days: 30
