name: Build AzadNet Final

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || echo "Build step finished"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Android-v1.0.0
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Source ZIP
        run: |
          zip -r AzadNet-Source-v1.0.0.zip . \
            -x "*.git*" -x "*build*" -x "*local.properties*" \
            -x "*.apk" -x "*artifacts*" -x "*.idea*" -x "*gradle/caches*"

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AzadNet-Source-v1.0.0
          path: AzadNet-Source-v1.0.0.zip
          retention-days: 30
